name: change-fake-money
# Click "Run workflow", type an amount, and both paper accounts restart with that much fake money.
# The old results are kept in data/archive/.
on:
  workflow_dispatch:
    inputs:
      amount:
        description: "Fake dollars per account (10 - 10,000,000)"
        required: true
        default: "1000"
permissions:
  contents: write
concurrency:
  group: state-writer
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restart both accounts
        env:
          AMOUNT: ${{ inputs.amount }}
        run: python -m bot reset --cash "$AMOUNT"
      - name: Commit
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add -A data
          git commit -q -m "fake money set to \$${{ inputs.amount }} per account"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
